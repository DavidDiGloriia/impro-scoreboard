<div [ngStyle]="screenStyle()">
<div class="myContainer"
     [ngStyle]="containerStyle()"
     [class.pushed-on-top]="projectionMode() === ProjectionMode.PUSHED_ON_TOP"
  >
    <!-- Décors de coin en fond : équipe A à gauche, équipe B à droite -->
    <app-team-layout class="layout layout-left" [team]="gameData().teamA" side="left"/>
    <app-team-layout class="layout layout-right" [team]="gameData().teamB" side="right"/>

    <div class="top-section"
         [class.pushed-on-top]="projectionMode() === ProjectionMode.PUSHED_ON_TOP"
    >
      @if (roundTimer()) {
        <div class="total-timer">
          <span id="total-timer">{{ roundTimer() | formatTime }} </span>
        </div>
      }
      <div class="teams"
      >
        <app-scoreboard-team [teamNumber]="Team.TEAM_A"
                             [team]="gameData().teamA"
        />
        <div class="round-timer">
          @if(improData().isImproRunning){
            <br><span id="round-timer">{{ improTimer() | formatTime }}</span>
          } @else {
            <img [src]="logoSrc()" alt="improvisation.be" class="scoreboard-logo"/>
          }
        </div>
        <app-scoreboard-team [teamNumber]="Team.TEAM_B"
                             [team]="gameData().teamB"
        />
      </div>
    </div>
    @if(improData().isImproRunning){
      <div class="bottom-section">
        <div class="theme-box"
             [class.pushed-on-top]="projectionMode() === ProjectionMode.PUSHED_ON_TOP"
        >
          <!-- type ∙ nombre de joueurs ∙ catégorie, sur une ligne au-dessus du titre -->
          <div class="theme-type" id="theme-type">
            {{ [improData() | formatImproHeader, improData().category | titlecase] | joinNonEmpty:' ∙ ' }}
          </div>
          <div class="theme-title" id="theme-title">
            {{  improData().title }}
          </div>
        </div>
      </div>
    }
  </div>
</div>
