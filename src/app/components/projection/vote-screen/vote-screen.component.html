<div [ngStyle]="screenStyle()">
  <div class="main-container"
       [class.pushed-on-top]="projectionMode() === ProjectionMode.PUSHED_ON_TOP"
       [ngStyle]="containerStyle()">

    <!-- Décors de coin en fond : équipe A à gauche, équipe B à droite -->
    <app-team-layout class="layout layout-left" [team]="gameData().teamA" side="left"/>
    <app-team-layout class="layout layout-right" [team]="gameData().teamB" side="right"/>

    <div class="content">
      <div class="title">Votez pour<br>les étoiles</div>
      <div class="subtitle">Scannez le QR code et classez vos trois joueurs préférés</div>

      <div class="qr-row">
        <div class="team team-a" [style.--team-color]="teamAMetadata()?.color">{{ gameData().teamA.displayName }}</div>
        <div class="qr">
          @if (qrDataUrl()) {
            <img [src]="qrDataUrl()" alt="QR code de vote"/>
          }
        </div>
        <div class="team team-b" [style.--team-color]="teamBMetadata()?.color">{{ gameData().teamB.displayName }}</div>
      </div>

      <div class="url">{{ shortUrl }}</div>
    </div>
  </div>
</div>
