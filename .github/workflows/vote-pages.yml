# Déploie la page de vote des étoiles (dossier vote/) sur GitHub Pages.
# URL : https://daviddigloriia.github.io/impro-scoreboard/
name: 'Vote étoiles (GitHub Pages)'

on:
  push:
    branches: [main]
    paths:
      - 'vote/**'
      - 'scripts/vote-build.js'
      - 'src/assets/data/joueurs.json'
      - 'src/assets/data/equipes.json'
      - 'src/assets/joueurs/**'
      - '.github/workflows/vote-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: vote-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: ImageMagick (vignettes WebP)
        run: sudo apt-get update -q && sudo apt-get install -y -q imagemagick
      - name: Vignettes et données
        run: node scripts/vote-build.js
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: vote
      - id: deployment
        uses: actions/deploy-pages@v4
